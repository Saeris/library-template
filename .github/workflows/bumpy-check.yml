name: Bumpy Check

on:
  pull_request:
    branches: [main]

jobs:
  bumpy-check:
    name: Release Plan
    # The template is never released, so its PRs carry no bump files.
    if: github.repository != 'Saeris/library-template'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "lts"
          cache: true

      - run: vp dlx @varlock/bumpy ci check
        env:
          GH_TOKEN: ${{ github.token }}
